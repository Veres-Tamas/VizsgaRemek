<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotógaléria</title>
<style>
  :root {
    --bg: #17181c;
    --panel: #1f2127;
    --text: #f2f0ea;
    --muted: #8b8d97;
    --accent: #e8b04b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem;
  }

  h1 {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 400;
    letter-spacing: 0.02em;
    margin: 0 0 0.5rem 0;
    text-align: center;
  }

  .subtitle {
    color: var(--muted);
    font-family: Arial, sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 3rem;
  }

  .gallery {
    display: flex;
    gap: 2rem;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 900px;
  }

  .photo-card {
    background: var(--panel);
    border: none;
    padding: 0;
    cursor: pointer;
    border-radius: 6px;
    overflow: hidden;
    width: 320px;
    display: block;
    text-decoration: none;
    color: inherit;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .photo-card:hover,
  .photo-card:focus-visible {
    transform: translateY(-4px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.4);
  }

  .photo-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .photo-card img {
    display: block;
    width: 100%;
    height: 220px;
    object-fit: cover;
  }

  .photo-card .caption {
    font-family: Arial, sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
    padding: 0.7rem 1rem;
    text-align: left;
  }

  @media (prefers-reduced-motion: reduce) {
    .photo-card { transition: none; }
  }
</style>
</head>
<body>

  <h1>Fotógaléria</h1>
  <div class="subtitle">Kattints egy képre a részletekért</div>

  <div class="gallery">
    <a class="photo-card" href="../Backend/bivak-cserepesko.php">
      <img src="images/Bivak/CserepesK.jpg" alt="Cserepes-kő">
      <div class="caption">Cserepes-kő</div>
    </a>

    <a class="photo-card" href="../Backend/bivak-toldi.php">
      <img src="images/Bivak/ToldiK.jpg" alt="Toldi kunyhó">
      <div class="caption">Toldi kunyhó</div>
    </a>
  </div>

</body>
</html>
